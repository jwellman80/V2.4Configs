[force_move]
enable_force_move: True

[AFC_buffer lane0_buffer]
advance_pin: ^!nest:PD3
trailing_pin: ^!nest: PD2
multiplier_high: 1.05   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament

[AFC_buffer lane1_buffer]
advance_pin: ^!nest:PD0
trailing_pin: ^!nest: PA15
multiplier_high: 1.05   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament

[AFC_buffer lane2_buffer]
advance_pin: ^!nest:PC7
trailing_pin: ^!nest: PC6
multiplier_high: 1.05   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament

[AFC_buffer lane3_buffer]
advance_pin: ^!nest:PA9
trailing_pin: ^!nest: PA8
multiplier_high: 1.05   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament


[AFC_extruder extruder]
pin_tool_start: ^!EBBT0:PB3
pin_tool_end: ^!EBBT0:PB4
tool_stn: 65                    # Distance in mm from the toolhead sensor to the tip of the nozzle in mm, if `tool_end` is defined then distance is from this sensor
tool_stn_unload: 100            # Distance to move in mm while unloading toolhead
tool_sensor_after_extruder: 0   # Extra distance to move in mm once pre/post sensors are clear. Useful for when only using post sensor, so this distance can be the amout to move to clear extruder gears
tool_unload_speed: 25           # Unload speed in mm/s when unloading toolhead. Default is 25mm/s.
tool_load_speed: 25             # Load speed in mm/s when loading toolhead. Default is 25mm/s.
tool: tool T0

[AFC_extruder extruder1]
pin_tool_start: ^!EBBT1:PB3
pin_tool_end: ^!EBBT1:PB4
tool_stn: 65                    # Distance in mm from the toolhead sensor to the tip of the nozzle in mm, if `tool_end` is defined then distance is from this sensor
tool_stn_unload: 100            # Distance to move in mm while unloading toolhead
tool_sensor_after_extruder: 0   # Extra distance to move in mm once pre/post sensors are clear. Useful for when only using post sensor, so this distance can be the amout to move to clear extruder gears
tool_unload_speed: 25           # Unload speed in mm/s when unloading toolhead. Default is 25mm/s.
tool_load_speed: 25             # Load speed in mm/s when loading toolhead. Default is 25mm/s.
tool: tool T1

[AFC_extruder extruder2]
pin_tool_start: ^!EBBT2:PB3
