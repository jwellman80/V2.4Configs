# Z probe implementation: per-tool touch probe (tap), using each EBB
# board's PB5 pin - the same physical microswitch that beacon.cfg wires
# up as each tool's `detection_pin` instead. Only one mode may claim the
# pin, so toolchanger/tools/T*.cfg no longer sets detection_pin directly.
# Toggled on/off from printer.cfg alongside toolchanger/probe/beacon.cfg -
# only one of the two should be included at a time.
#
# SAFETY: z_offset below is a placeholder (0) and MUST be calibrated per
# tool before use - run CALIBRATE_NOZZLE_PROBE_OFFSET (or
# CALIBRATE_ALL_OFFSETS) for each tool and save the result, then confirm
# with QUERY_PROBE / PROBE that it triggers cleanly before trusting it for
# G28 Z, QUAD_GANTRY_LEVEL, or BED_MESH_CALIBRATE. Also verify the pin
# polarity (^EBBTn:PB5) actually triggers on nozzle contact for your
# wiring - it mirrors the tap reference config, but detection_pin on the
# same pin is inverted (!EBBTn:PB5), so double-check before printing.

[tool_probe_endstop]
crash_gcode:
    RESPOND TYPE=error MSG='Tool not detected, expected {printer.toolchanger.tool_number}. Aborting the print.'
    M84
    TURN_OFF_HEATERS

[gcode_macro INITIALIZE_TOOLCHANGER]
rename_existing: INITIALIZE_TOOLCHANGER_ORIG
gcode:
    _INITIALIZE_FROM_DETECTED_TOOL

[gcode_macro _INITIALIZE_FROM_DETECTED_TOOL]
gcode:
    DETECT_ACTIVE_TOOL_PROBE
    _INITIALIZE_FROM_DETECTED_TOOL_IMPL

[gcode_macro _INITIALIZE_FROM_DETECTED_TOOL_IMPL]
gcode:
    {% if printer.tool_probe_endstop.active_tool_number | int == -1 %}
        RESPOND TYPE=error MSG='Failed to detect active tool'
        PAUSE
    {% else %}
        { action_respond_info('initialize from detected tool') }
        INITIALIZE_TOOLCHANGER_ORIG T={printer.tool_probe_endstop.active_tool_number}
    {% endif %}

# per-tool probe is not yet integrated with toolchanger tool detection;
# this overrides VERIFY_TOOL_DETECTED to use the tool_probe instead of
# each tool's detection_pin.
[gcode_macro VERIFY_TOOL_DETECTED]
rename_existing: VERIFY_TOOL_DETECTED_ORIG
gcode:
    G4 P200
    DETECT_ACTIVE_TOOL_PROBE
    _STOP_IF_INCORRECT_TOOL {rawparams}

[gcode_macro _STOP_IF_INCORRECT_TOOL]
gcode:
    {% if T in params and printer.tool_probe_endstop.active_tool_number | int != params.T | int %}
        RESPOND TYPE=error MSG='Tool not detected, expected {params.T}. Pausing the print.'
        M112
    {% elif printer.tool_probe_endstop.active_tool_number | int == -1 %}
        RESPOND TYPE=error MSG='No tool detected. Pausing the print.'
        M112
    {% endif %}

[tool_probe T0]
pin: ^EBBT0:PB5
tool: 0
z_offset: -1.578 
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder

[tool_probe T1]
pin: ^EBBT1:PB5
tool: 1
z_offset: 0 # REQUIRES CALIBRATION
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder

[tool_probe T2]
pin: ^EBBT2:PB5
tool: 2
z_offset: 0 # REQUIRES CALIBRATION
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder

[tool_probe T3]
pin: ^EBBT3:PB5
tool: 3
z_offset: 0 # REQUIRES CALIBRATION
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder
