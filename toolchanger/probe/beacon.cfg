# Z probe implementation: Beacon eddy-current scanner.
# Toggled on/off from printer.cfg alongside toolchanger/probe/tool_probe.cfg -
# only one of the two should be included at a time.

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_8446E7355154354D38202020FF0A1710-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 50 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
default_probe_method: proximity

# Beacon doesn't use each tool's tap switch for Z, so it's free to use for
# tool presence detection instead. Adds detection_pin to the [tool Tn]
# sections declared in toolchanger/tools/T*.cfg (same pin tool_probe.cfg
# uses for Z probing in the other mode - only one mode can claim it).
[tool T0]
detection_pin: !EBBT0:PB5

[tool T1]
detection_pin: !EBBT1:PB5

[tool T2]
detection_pin: !EBBT2:PB5

[tool T3]
detection_pin: !EBBT3:PB5
