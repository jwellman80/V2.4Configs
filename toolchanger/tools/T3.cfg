# This file contains common pin mappings for the BIGTREETECH EBBT3
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBT3]
canbus_uuid: aea517ef280c
# python3 ~/katapult/scripts/flashtool.py -i can0 -u aea517ef280c -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u aea517ef280c -f ~/klipper/out/klipper.bin
[adxl345]
cs_pin: EBBT3: PB12
spi_software_sclk_pin: EBBT3: PB10
spi_software_mosi_pin: EBBT3: PB11
spi_software_miso_pin: EBBT3: PB2
axes_map: x,y,z

[extruder3]
step_pin: EBBT3: PD0
dir_pin: !EBBT3: PD1
enable_pin: !EBBT3: PD2
heater_pin: EBBT3: PB13
sensor_pin: EBBT3: PA3
sensor_type: ATC Semitec 104NT-4-R025H42G

full_steps_per_rotation: 200
microsteps: 32
rotation_distance: 5.6
nozzle_diameter: 0.400
filament_diameter: 1.750

control: pid

pid_Kp: 30   #44.282 
pid_Ki: 10   #18.451 
pid_Kd: 26.570

min_temp: 0
max_temp: 300

[tmc2209 extruder3]
uart_pin: EBBT3: PA15
run_current: 0.5
stealthchop_threshold: 0

[heater_fan AH3_hotend_fan]
pin: EBBT3: PA0
heater: extruder3
heater_temp: 50.0

[fan_generic AH3_partfan]
pin: EBBT3: PA1

[gcode_macro AH3]
variable_active: 0
variable_filament_consumed: 0
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_respond_info("Please home XYZ first")}
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=AH3 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder3
    SELECT_TOOL T=3
  {% endif %}

[gcode_macro T3]
variable_realtool: "AH3"
variable_backuptool: ""
variable_color: ""
gcode:
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}


#change the tool numbers to the tool you are configuring, ie T0, T1, etc
[tool AH3]
#change this too
tool_number: 3
#if this were T1, then this would be extruder1, etc
extruder: extruder3
#Change T0_partfan to tool number
fan: fan_generic AH3_partfan
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 203
params_park_y: 2
params_park_z: 310
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 52
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 37.2
params_input_shaper_damping_ratio_y: 0.01


[tool_probe AH3]
pin: ^EBBT3:PB5
tool: 3
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
z_offset: -0.63 # More positive = More Squish
# drop_first_result: True # enable is on danger-klipper
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder3

[neopixel T3_leds]
pin: EBBT3:PD3
chain_count: 1
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[gcode_macro _T3_vars]
variable_logo_led_name:         "T3_leds"
variable_logo_idx:              "1"
# variable_nozzle_led_name:       "T3_leds"
# variable_nozzle_idx:            "2,3"
gcode:

