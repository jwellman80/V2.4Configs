[filament_switch_sensor tool_sensor_T0]
pause_on_runout: False
switch_pin: ^!EBBT0:PB3
insert_gcode:
  INSERT_LOAD_FILAMENT T=0

[filament_switch_sensor extruder_sensor_T0]
pause_on_runout: False
switch_pin: ^!EBBT0:PB4


[filament_switch_sensor tool_sensor_T1]
pause_on_runout: False
