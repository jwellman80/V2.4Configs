[include readonly-configs/toolchanger-include.cfg]

# [tool_crash]
# crash_gcode:
#     TEST_CRASH


[gcode_macro TEST_CRASH]
gcode: 
    M400
    RESPOND TYPE=error MSG='Tool not detected, expected {printer.toolchanger.tool_number}. Aborting the print.' 
    G91
    G0 Z5 E-2 F3600
    G90
    G0 X175 Y350 F12000
    M84
    TURN_OFF_HEATERS

[include ../AFC/*.cfg]
[include toolchanger-loading-macros.cfg]
[include ../macros/pooper.cfg]
[include toolchanger-leds.cfg]
#[include LEDs.cfg]


[gcode_macro DISPLAY_TOOL_OFFSETS]
description: Display all tool offsets and current Klipper offset state
gcode:
    {% set toolchanger = printer['toolchanger'] %}
    {% set gcode_move = printer.gcode_move %}
    {% set nl = '\n' %}
    {% set ns = namespace(out='') %}

    {% set ns.out = ns.out ~ "========== TOOL OFFSET VERIFICATION ==========" ~ nl ~ nl %}

    # Current Klipper State
    {% set ns.out = ns.out ~ "=== CURRENT KLIPPER STATE ===" ~ nl %}
    {% set ns.out = ns.out ~ "Kinematic Position: X=" ~ gcode_move.position.x ~ " Y=" ~ gcode_move.position.y ~ " Z=" ~ gcode_move.position.z ~ nl %}
    {% set ns.out = ns.out ~ "Gcode Position: X=" ~ gcode_move.gcode_position.x ~ " Y=" ~ gcode_move.gcode_position.y ~ " Z=" ~ gcode_move.gcode_position.z ~ nl %}
    {% set ns.out = ns.out ~ "Active Gcode Offsets: X=" ~ gcode_move.homing_origin.x ~ " Y=" ~ gcode_move.homing_origin.y ~ " Z=" ~ gcode_move.homing_origin.z ~ nl ~ nl %}

    # Active Tool Info
    {% if toolchanger.tool %}
        {% set active_tool = printer[toolchanger.tool] %}
        {% set ns.out = ns.out ~ "=== ACTIVE TOOL: " ~ toolchanger.tool ~ " (T" ~ toolchanger.tool_number ~ ") ===" ~ nl %}
        {% set ns.out = ns.out ~ "Tool Gcode Offsets: X=" ~ active_tool.gcode_x_offset ~ " Y=" ~ active_tool.gcode_y_offset ~ " Z=" ~ active_tool.gcode_z_offset ~ nl %}
        {% set ns.out = ns.out ~ "Expected Nozzle Position (with offsets): X=" ~ (gcode_move.position.x + active_tool.gcode_x_offset) ~ " Y=" ~ (gcode_move.position.y + active_tool.gcode_y_offset) ~ " Z=" ~ (gcode_move.position.z + active_tool.gcode_z_offset) ~ nl ~ nl %}
    {% else %}
        {% set ns.out = ns.out ~ "=== NO ACTIVE TOOL ===" ~ nl ~ nl %}
    {% endif %}

    # All Registered Tools
    {% set ns.out = ns.out ~ "=== ALL REGISTERED TOOLS ===" ~ nl %}
    {% for tool_number in toolchanger.tool_numbers %}
        {% set tool_name = toolchanger.tool_names[loop.index0] %}
        {% set tool = printer[tool_name] %}
        {% set ns.out = ns.out ~ "T" ~ tool_number ~ " (" ~ tool_name ~ "):" ~ nl %}
        {% set ns.out = ns.out ~ "  Gcode Offsets: X=" ~ tool.gcode_x_offset ~ " Y=" ~ tool.gcode_y_offset ~ " Z=" ~ tool.gcode_z_offset ~ nl %}
        {% set ns.out = ns.out ~ "  Extruder: " ~ (tool.extruder if tool.extruder else 'None') ~ nl %}
        {% set ns.out = ns.out ~ "  Active: " ~ ('Yes' if tool.active else 'No') ~ nl %}
    {% endfor %}
    {% set ns.out = ns.out ~ nl %}

    # Offset Explanation
    {% set ns.out = ns.out ~ "=== OFFSET EXPLANATION ===" ~ nl %}
    {% set ns.out = ns.out ~ "Kinematic Position = Physical toolhead mount position" ~ nl %}
    {% set ns.out = ns.out ~ "Gcode Position = Kinematic Position + Active Tool Offsets" ~ nl %}
    {% set ns.out = ns.out ~ "Active Gcode Offsets = Currently applied offsets (from SET_GCODE_OFFSET)" ~ nl %}
    {% set ns.out = ns.out ~ "Tool Gcode Offsets = Per-tool nozzle position compensation" ~ nl ~ nl %}
    {% set ns.out = ns.out ~ "During tool changes, gcode offsets are temporarily set to 0" ~ nl %}
    {% set ns.out = ns.out ~ "to work in kinematic space, then restored with new tool offsets." ~ nl %}
    {% set ns.out = ns.out ~ "==========================================" %}

    {action_respond_info(ns.out)}