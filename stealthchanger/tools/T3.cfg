# This file contains common pin mappings for the BIGTREETECH EBBT3
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBT3]
canbus_uuid: aea517ef280c
# python3 ~/katapult/scripts/flashtool.py -i can0 -u aea517ef280c -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u aea517ef280c -f ~/klipper/out/klipper.bin
[adxl345 T3]
cs_pin: EBBT3: PB12
spi_software_sclk_pin: EBBT3: PB10
spi_software_mosi_pin: EBBT3: PB11
spi_software_miso_pin: EBBT3: PB2
axes_map: x,z,-y

[extruder3]
step_pin: EBBT3: PD0
dir_pin: !EBBT3: PD1
enable_pin: !EBBT3: PD2
heater_pin: EBBT3: PB13
sensor_pin: EBBT3: PA3
sensor_type: ATC Semitec 104NT-4-R025H42G

full_steps_per_rotation: 200
microsteps: 16
gear_ratio: 9:1
rotation_distance: 47.088
nozzle_diameter: 0.400
filament_diameter: 1.750

control: pid

pid_Kp: 30   #44.282 
pid_Ki: 10   #18.451 
pid_Kd: 26.570

min_temp: 0
max_temp: 300

max_extrude_only_distance: 150

[tmc2209 extruder3]
uart_pin: EBBT3: PA15
run_current: 0.5
stealthchop_threshold: 0

[heater_fan T3_hotend_fan]
pin: EBBT3: PA0
heater: extruder3
heater_temp: 50.0

[fan_generic T3_partfan]
pin: EBBT3: PA1

[gcode_macro T3]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=3



#change the tool numbers to the tool you are configuring, ie T0, T1, etc
[tool T3]
#change this too
tool_number: 3
detection_pin: !EBBT3:PB5
#if this were T1, then this would be extruder1, etc
extruder: extruder3
#Change T0_partfan to tool number
fan: T3_partfan
#Tool offset is 0.368750,-0.003125,-1.076250
gcode_x_offset: 0.265625
gcode_y_offset: 0.493750
gcode_z_offset: 0.032500
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 262
params_park_y: 9
params_park_z: 309
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 46.4
params_input_shaper_damping_ratio_x: 0.098
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 34.4
params_input_shaper_damping_ratio_y: 0.088


# [tool_probe T3]
# pin: EBBT3:PB5
# tool: 3
# x_offset: 0 # X axis-sensor relative nozzle offset
# y_offset: 0 # Y axis-sensor relative nozzle offset
# z_offset: 0 # Z axis-sensor relative nozzle offset
