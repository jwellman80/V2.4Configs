# MCU flash configuration for this printer
# Used by update_klipper.sh (UKAM - Update Klipper And MCUs)
#
# Flash methods used:
#  - make flash           : USB serial boards (STM32F446, STM32H723)
#  - flashtool.py (CAN)   : CAN bus boards with Katapult bootloader
#
# Skip: [rpi] (host MCU, no firmware), [turtleneck] (not configured)

[mcu]
# Main MCU - BTT Octopus Pro, STM32F446 (USB serial)
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32f446xx_060021001050534E4E313120-if00

[Turtle_1]
# AFC Turtle 1 - STM32H723 (USB serial)
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32h723xx_110010000B51333235363331-if00

[EBBT0]
# EBB Toolhead T0 - CAN UUID: ac5f7df1a805
quiet_command: python3 ~/katapult/scripts/flashtool.py -i can0 -r -u ac5f7df1a805
quiet_command: sleep 2
action_command: python3 ~/katapult/scripts/flashtool.py -i can0 -f ~/klipper/out/klipper.bin -u ac5f7df1a805

[EBBT1]
# EBB Toolhead T1 - CAN UUID: 53af41a9474e
quiet_command: python3 ~/katapult/scripts/flashtool.py -i can0 -r -u 53af41a9474e
quiet_command: sleep 2
