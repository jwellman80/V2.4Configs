[gcode_macro MAINT_PARK]
gcode:
  CG28
  G0 X175 Y10 Z100 F15000

[gcode_macro TOOL_TEST]
gcode:
  INITIALIZE_TOOLCHANGER

  CG28
  #QUAD_GANTRY_LEVEL
  #G28 Z

 # SET_TOOL_PARAMETER PARAMETER='params_path_speed' VALUE=300

  TEST_TOOL_DOCKING RESTORE_AXIS=XYZ

  #RESET_TOOL_PARAMETER PARAMETER='params_path_speed'

[delayed_gcode startup]
initial_duration: 1
gcode:
  INITIALIZE_TOOLCHANGER


[delayed_gcode setup_vars]
initial_duration: 1
gcode: 
  {% set svv = printer.save_variables.variables %}
  {% if svv.total_tool_changes is not defined %}
    SAVE_VARIABLE VARIABLE=total_tool_changes VALUE=0
    SAVE_VARIABLE VARIABLE=total_tool_changes_since_failure VALUE=0
  {% endif %}